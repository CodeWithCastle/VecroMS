<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="VecroMS">
  <defs>
    <style>
      .car { fill: none; stroke: #00923F; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .win { fill: #FFF500; stroke: #00923F; stroke-width: 1.5; stroke-linejoin: round; }
      .whl { fill: none; stroke: #00923F; stroke-width: 3; }
      .road { stroke: #00923F; stroke-width: 2; stroke-dasharray: 10 7; stroke-linecap: round; }
      .word { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 34px; font-weight: 700; font-style: italic; fill: #00923F; letter-spacing: -0.5px; }
    </style>
  </defs>
  <!-- symbol -->
  <g transform="translate(6,6)">
    <!-- car body outline -->
    <path class="car" d="M4 40 C4 30 10 24 20 24 L32 24 L40 12 L66 12 L74 24 L88 24 C98 24 104 30 104 40 L104 48 L4 48 Z"/>
    <!-- windows -->
    <path class="win" d="M38 22 L44 14 L62 14 L68 22 Z"/>
    <rect class="win" x="70" y="24" width="18" height="14" rx="3"/>
    <!-- wheels -->
    <circle class="whl" cx="26" cy="50" r="8"/>
    <circle class="whl" cx="82" cy="50" r="8"/>
    <!-- road -->
    <line class="road" x1="0" y1="62" x2="108" y2="62"/>
  </g>
  <!-- wordmark -->
  <text class="word" x="128" y="52">VecroMS</text>
</svg>
